<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Grant Course Access — Test Admin (not linked, not indexed)</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #070F1A; --bg-2: #0A1628; --bg-3: #0D1E34;
    --teal: #2DD4BF; --teal-dark: #0D9488;
    --border: rgba(45,212,191,0.18); --border-dim: rgba(255,255,255,0.06);
    --text: #F0F4F8; --text-muted: #94A3B8; --text-dim: #4A5568;
    --green: #22C55E; --red: #EF4444; --amber: #F59E0B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
    min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 420px; }
  .banner {
    background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.3);
    border-radius: 10px; padding: 12px 16px; font-size: 12px; color: var(--amber);
    margin-bottom: 24px; line-height: 1.6;
  }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  h1 span { color: var(--teal); }
  .sub { font-size: 12px; color: var(--text-muted); margin-bottom: 24px; }
  .card {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px;
  }
  .field-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
  .input {
    background: var(--bg-3); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px; font-size: 14px; color: var(--text);
    outline: none; width: 100%; margin-bottom: 12px;
  }
  .input:focus { border-color: var(--teal); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border-radius: 10px; font-weight: 700; font-size: 13px;
    cursor: pointer; border: none; padding: 11px 18px; width: 100%;
  }
  .btn-primary { background: var(--teal); color: #070F1A; }
  .btn-primary:hover { background: var(--teal-dark); }
  .msg { font-size: 12px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; display: none; line-height: 1.5; }
  .msg.show { display: block; }
  .msg.err { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--red); }
  .msg.ok  { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: var(--green); }
  .hidden { display: none !important; }
  #loginScreen { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="banner">
    🧪 Test admin page only — not linked from the site, not indexed. Grants course access manually while payment isn't wired in yet.
  </div>

  <!-- Password gate -->
  <div id="loginScreen">
    <h1>Grant <span>Access</span></h1>
    <div class="card" style="width:100%">
      <label class="field-label">Admin Password</label>
      <input type="password" class="input" id="pw" placeholder="Enter admin password"/>
      <button class="btn btn-primary" id="pwBtn">Enter</button>
      <div class="msg" id="pwMsg"></div>
    </div>
  </div>

  <!-- Grant form -->
  <div id="formScreen" class="hidden">
    <h1>Grant <span>Access</span></h1>
    <div class="sub">Add a user's email to unlock a course for them.</div>
    <div class="card">
      <label class="field-label">User's Email (the one they signed up with)</label>
      <input type="email" class="input" id="grantEmail" placeholder="student@example.com"/>
      <label class="field-label">Course ID</label>
      <input type="text" class="input" id="grantCourse" value="test-course"/>
      <button class="btn btn-primary" id="grantBtn">Grant Access</button>
      <div class="msg" id="grantMsg"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ── Same project as member-test.html ──
  const SUPABASE_URL = 'https://ucpjcopozlunknosugxd.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjcGpjb3Bvemx1bmtub3N1Z3hkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjUzNDAsImV4cCI6MjEwMTk0MTM0MH0.82r72tSsEVdJThuOtXLh2MO2WhLE42IUgIKm9bCa_Mw';

  // ── Change both of these to match what you set in the SQL function ──
  const ADMIN_PASSWORD = 'Dubai@2026';   // page login password
  const ADMIN_SECRET    = 'Dubai@2026';  // must match correct_secret in the SQL function

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const pwMsg = document.getElementById('pwMsg');
  document.getElementById('pwBtn').addEventListener('click', () => {
    const val = document.getElementById('pw').value;
    if (val === ADMIN_PASSWORD) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('formScreen').classList.remove('hidden');
    } else {
      pwMsg.textContent = 'Incorrect password.';
      pwMsg.className = 'msg show err';
    }
  });
  document.getElementById('pw').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('pwBtn').click();
  });

  const grantMsg = document.getElementById('grantMsg');
  document.getElementById('grantBtn').addEventListener('click', async () => {
    const email = document.getElementById('grantEmail').value.trim();
    const course = document.getElementById('grantCourse').value.trim();
    if (!email || !course) {
      grantMsg.textContent = 'Enter both an email and a course ID.';
      grantMsg.className = 'msg show err';
      return;
    }
    grantMsg.textContent = 'Granting...';
    grantMsg.className = 'msg show ok';

    const { data, error } = await sb.rpc('grant_course_access', {
      target_email: email,
      target_course: course,
      admin_secret: ADMIN_SECRET
    });

    if (error) {
      grantMsg.textContent = 'Error: ' + error.message;
      grantMsg.className = 'msg show err';
    } else {
      grantMsg.textContent = data;
      grantMsg.className = 'msg show ok';
    }
  });
</script>
</body>
</html>
