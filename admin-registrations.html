<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin — Registrations</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:    #070F1A;
      --bg2:   #0C1624;
      --bg3:   #111E30;
      --gold:  #DAA520;
      --gold-d:#B8860B;
      --teal:  #2DD4BF;
      --border:rgba(255,255,255,0.08);
      --text:  #E8EEF4;
      --muted: #8A9BB0;
      --green: #22C55E;
      --red:   #EF4444;
      --amber: #F59E0B;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

    /* ── LOGIN ── */
    #loginScreen {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
    }
    .login-box {
      background:var(--bg2); border:1px solid var(--border); border-radius:20px;
      padding:40px; width:100%; max-width:360px; text-align:center;
    }
    .login-box h1 {
      font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:800;
      color:var(--gold); margin-bottom:6px;
    }
    .login-box p { font-size:13px; color:var(--muted); margin-bottom:28px; }
    .inp {
      width:100%; background:var(--bg3); border:1px solid var(--border);
      border-radius:10px; padding:12px 14px; font-size:14px; color:var(--text);
      outline:none; margin-bottom:14px;
    }
    .inp:focus { border-color:var(--gold); }
    .btn-gold {
      width:100%; padding:13px; border-radius:10px; border:none; cursor:pointer;
      background:linear-gradient(135deg,var(--gold-d),var(--gold));
      color:#070F1A; font-weight:700; font-size:14px; transition:opacity 0.2s;
    }
    .btn-gold:hover { opacity:0.9; }
    .login-err { color:var(--red); font-size:12px; margin-top:10px; display:none; }

    /* ── HEADER ── */
    #adminApp { display:none; }
    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 28px; border-bottom:1px solid var(--border);
      background:rgba(7,15,26,0.97); position:sticky; top:0; z-index:100;
    }
    .topbar-title { font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:800; color:var(--gold); }
    .topbar-right { display:flex; align-items:center; gap:14px; }
    .badge-count {
      background:rgba(218,165,32,0.15); border:1px solid rgba(218,165,32,0.3);
      color:var(--gold); font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px;
    }
    .btn-logout {
      background:transparent; border:1px solid var(--border); color:var(--muted);
      font-size:12px; padding:6px 14px; border-radius:8px; cursor:pointer;
    }
    .btn-logout:hover { border-color:var(--red); color:var(--red); }

    /* ── FILTERS ── */
    .filters {
      display:flex; gap:8px; padding:20px 28px 0;
      flex-wrap:wrap;
    }
    .filter-btn {
      padding:7px 16px; border-radius:20px; border:1px solid var(--border);
      background:transparent; color:var(--muted); font-size:13px; cursor:pointer;
      transition:all 0.2s;
    }
    .filter-btn.active { background:var(--gold); color:#070F1A; border-color:var(--gold); font-weight:700; }
    .filter-btn:hover:not(.active) { border-color:var(--gold); color:var(--gold); }

    /* ── GRID ── */
    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
      gap:20px; padding:20px 28px 40px;
    }

    /* ── CARD ── */
    .card {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:16px; overflow:hidden;
    }
    .card-header {
      padding:16px 18px 12px;
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
    }
    .card-name { font-weight:700; font-size:15px; }
    .card-ref { font-size:11px; color:var(--muted); margin-top:2px; }
    .status-badge {
      font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px;
      text-transform:uppercase; letter-spacing:0.4px;
    }
    .status-pending  { background:rgba(245,158,11,0.12); color:var(--amber); border:1px solid rgba(245,158,11,0.3); }
    .status-approved { background:rgba(34,197,94,0.1); color:var(--green); border:1px solid rgba(34,197,94,0.3); }
    .status-rejected { background:rgba(239,68,68,0.1); color:var(--red); border:1px solid rgba(239,68,68,0.3); }

    .card-body { padding:16px 18px; }
    .info-row { display:flex; gap:6px; font-size:13px; margin-bottom:8px; line-height:1.5; }
    .info-label { color:var(--muted); min-width:90px; flex-shrink:0; }
    .info-val { color:var(--text); word-break:break-word; }

    .divider { border:none; border-top:1px solid var(--border); margin:12px 0; }

    /* Receipt */
    .receipt-wrap { margin-top:12px; }
    .receipt-label { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
    .receipt-img {
      width:100%; border-radius:10px; border:1px solid var(--border);
      cursor:pointer; transition:opacity 0.2s;
    }
    .receipt-img:hover { opacity:0.85; }
    .receipt-none { font-size:12px; color:var(--muted); font-style:italic; }

    /* Actions */
    .card-actions {
      display:flex; gap:8px; padding:12px 18px 16px;
      border-top:1px solid var(--border);
    }
    .btn-action {
      flex:1; padding:9px; border-radius:9px; border:none; cursor:pointer;
      font-size:13px; font-weight:700; transition:all 0.2s;
    }
    .btn-approve  { background:rgba(34,197,94,0.1); color:var(--green); border:1px solid rgba(34,197,94,0.3); }
    .btn-approve:hover  { background:var(--green); color:#fff; }
    .btn-reject   { background:rgba(239,68,68,0.1); color:var(--red); border:1px solid rgba(239,68,68,0.3); }
    .btn-reject:hover   { background:var(--red); color:#fff; }
    .btn-delete   { background:rgba(239,68,68,0.06); color:#F87171; border:1px solid rgba(239,68,68,0.2); }
    .btn-delete:hover   { background:var(--red); color:#fff; }
    .btn-restore  { background:rgba(45,212,191,0.1); color:var(--teal); border:1px solid rgba(45,212,191,0.3); }
    .btn-restore:hover  { background:var(--teal); color:#070F1A; }
    .btn-destroy  { background:rgba(239,68,68,0.15); color:var(--red); border:1px solid rgba(239,68,68,0.4); }
    .btn-destroy:hover  { background:var(--red); color:#fff; }
    .btn-action:disabled { opacity:0.4; cursor:not-allowed; }

    /* Confirm overlay */
    #confirmBox {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75);
      z-index:998; align-items:center; justify-content:center;
    }
    #confirmBox.open { display:flex; }
    .confirm-card {
      background:var(--bg2); border:1px solid var(--border); border-radius:16px;
      padding:28px 32px; max-width:360px; width:90%; text-align:center;
    }
    .confirm-card h3 { font-size:16px; font-weight:700; margin-bottom:10px; }
    .confirm-card p  { font-size:13px; color:var(--muted); margin-bottom:22px; line-height:1.6; }
    .confirm-btns    { display:flex; gap:10px; }
    .confirm-btns button { flex:1; padding:10px; border-radius:9px; border:none; cursor:pointer; font-weight:700; font-size:13px; }
    .confirm-cancel  { background:var(--bg3); color:var(--muted); }
    .confirm-ok      { background:var(--red); color:#fff; }

    /* Empty / loading */
    .state-msg {
      text-align:center; padding:60px 20px; color:var(--muted); font-size:14px;
    }
    .spinner-ring {
      width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--gold);
      border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Lightbox */
    #lightbox {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9);
      z-index:999; align-items:center; justify-content:center;
    }
    #lightbox.open { display:flex; }
    #lightbox img { max-width:90vw; max-height:90vh; border-radius:12px; }
    #lightbox::after {
      content:'✕'; position:absolute; top:20px; right:28px;
      color:#fff; font-size:24px; cursor:pointer;
    }

    @media(max-width:600px) {
      .grid { padding:16px; gap:16px; grid-template-columns:1fr; }
      .filters { padding:16px 16px 0; }
      .topbar { padding:14px 16px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>⚙️ Admin Panel</h1>
    <p>Trends & Trade — Registrations</p>
    <input class="inp" type="password" id="pwdInput" placeholder="Enter admin password" autocomplete="current-password"/>
    <button class="btn-gold" onclick="checkLogin()">Sign In</button>
    <div class="login-err" id="loginErr">Incorrect password.</div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp">
  <div class="topbar">
    <div class="topbar-title">Registrations</div>
    <div class="topbar-right">
      <span class="badge-count" id="pendingCount">0 pending</span>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('pending',this)">Pending</button>
    <button class="filter-btn" onclick="setFilter('approved',this)">Approved</button>
    <button class="filter-btn" onclick="setFilter('rejected',this)">Rejected</button>
    <button class="filter-btn" onclick="setFilter('deleted',this)" style="border-color:rgba(239,68,68,0.3);color:#F87171;">🗑 Deleted</button>
  </div>

  <div class="grid" id="grid">
    <div class="state-msg"><div class="spinner-ring"></div>Loading registrations…</div>
  </div>
</div>

<!-- CONFIRM -->
<div id="confirmBox">
  <div class="confirm-card">
    <h3 id="confirmTitle">Are you sure?</h3>
    <p id="confirmMsg"></p>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-ok" id="confirmOkBtn">Yes, delete</button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lbImg" src="" alt="Receipt"/>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  /* ── CONFIG ── */
  const SUPABASE_URL      = 'https://ucpjcopozlunknosugxd.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjcGpjb3Bvemx1bmtub3N1Z3hkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjUzNDAsImV4cCI6MjEwMTk0MTM0MH0.82r72tSsEVdJThuOtXLh2MO2WhLE42IUgIKm9bCa_Mw';
  const ADMIN_PASSWORD    = 'snradmin2025';   // ← change this to your preferred password

  const EMAILJS_PUBLIC_KEY           = '3NuU-eUqGg06cjv1i';
  const EMAILJS_SERVICE_ID           = 'service_xmm4jck';
  const EMAILJS_CREDS_TEMPLATE_ID    = 'template_k4spvuc';

  emailjs.init(EMAILJS_PUBLIC_KEY);
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let allData = [];
  let currentFilter = 'all';

  /* ── LOGIN ── */
  document.getElementById('pwdInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkLogin();
  });

  function checkLogin() {
    const pwd = document.getElementById('pwdInput').value;
    if (pwd === ADMIN_PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminApp').style.display = 'block';
      loadRegistrations();
    } else {
      document.getElementById('loginErr').style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminApp').style.display = 'none';
    document.getElementById('pwdInput').value = '';
  }

  /* ── LOAD DATA ── */
  async function loadRegistrations() {
    const { data, error } = await sb
      .from('registrations')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('grid').innerHTML =
        `<div class="state-msg">Error loading data: ${error.message}</div>`;
      return;
    }
    allData = data || [];
    updatePendingCount();
    renderCards();
  }

  function updatePendingCount() {
    const n = allData.filter(r => r.status === 'pending').length;
    document.getElementById('pendingCount').textContent = n + ' pending';
  }

  /* ── FILTER ── */
  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards();
  }

  /* ── RENDER ── */
  function renderCards() {
    const filtered = currentFilter === 'all'
      ? allData.filter(r => r.status !== 'deleted')   // hide deleted from All
      : allData.filter(r => r.status === currentFilter);

    const grid = document.getElementById('grid');
    if (!filtered.length) {
      grid.innerHTML = `<div class="state-msg">No ${currentFilter === 'all' ? '' : currentFilter + ' '}registrations found.</div>`;
      return;
    }

    grid.innerHTML = filtered.map(r => buildCard(r)).join('');
  }

  function buildCard(r) {
    const statusClass = r.status === 'approved' ? 'status-approved'
                      : r.status === 'rejected'  ? 'status-rejected'
                      : 'status-pending';

    const date = new Date(r.created_at).toLocaleString('en-GB', {
      day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'
    });

    const receipt = r.receipt_data
      ? `<div class="receipt-wrap">
           <div class="receipt-label">Payment Receipt</div>
           <img class="receipt-img" src="${r.receipt_data}" alt="Receipt"
                onclick="openLightbox('${r.id}')" loading="lazy"/>
         </div>`
      : `<div class="receipt-wrap"><div class="receipt-label">Payment Receipt</div>
           <div class="receipt-none">No receipt uploaded</div></div>`;

    const isPending = r.status === 'pending';
    const isDeleted = r.status === 'deleted';

    return `
    <div class="card" id="card-${r.id}">
      <div class="card-header">
        <div>
          <div class="card-name">${esc(r.name)}</div>
          <div class="card-ref">Ref: ${r.id.slice(0,8).toUpperCase()} · ${date}</div>
        </div>
        <span class="status-badge ${statusClass}">${r.status}</span>
      </div>
      <div class="card-body">
        <div class="info-row"><span class="info-label">Email</span><span class="info-val">${esc(r.email)}</span></div>
        <div class="info-row"><span class="info-label">WhatsApp</span><span class="info-val">${esc(r.whatsapp)}</span></div>
        <div class="info-row"><span class="info-label">Country</span><span class="info-val">${esc(r.country)}</span></div>
        <div class="info-row"><span class="info-label">Age</span><span class="info-val">${r.age}</span></div>
        <hr class="divider"/>
        <div class="info-row"><span class="info-label">Experience</span><span class="info-val">${esc(r.trading_experience)}</span></div>
        <div class="info-row"><span class="info-label">Courses</span><span class="info-val">${esc(r.courses_interested)}</span></div>
        <div class="info-row"><span class="info-label">Previous</span><span class="info-val">${esc(r.previous_courses || 'None')}</span></div>
        <hr class="divider"/>
        <div class="info-row"><span class="info-label">Payment</span><span class="info-val">${esc(r.payment_method)}</span></div>
        ${r.notes ? `<div class="info-row"><span class="info-label">Notes</span><span class="info-val">${esc(r.notes)}</span></div>` : ''}
        ${receipt}
      </div>
      ${r.status === 'deleted'
        ? `<div class="card-actions">
             <button class="btn-action btn-restore" onclick="updateStatus('${r.id}','pending')">↩ Restore</button>
             <button class="btn-action btn-destroy" onclick="hardDelete('${r.id}')">🗑 Delete Forever</button>
           </div>`
        : `<div class="card-actions">
             <button class="btn-action btn-approve" ${!isPending?'disabled':''} onclick="updateStatus('${r.id}','approved')">✓ Approve</button>
             <button class="btn-action btn-reject"  ${!isPending?'disabled':''} onclick="updateStatus('${r.id}','rejected')">✕ Reject</button>
             <button class="btn-action btn-delete"  onclick="hardDelete('${r.id}')">🗑 Delete</button>
           </div>`}
    </div>`;
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── HELPERS ── */
  function generateUsername(name) {
    const clean = name.trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    const num   = Math.floor(10000 + Math.random() * 90000);
    return `SNR_${clean}_${num}`;
  }

  function generatePassword(len = 10) {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789@#!';
    let pwd = '';
    for (let i = 0; i < len; i++) pwd += chars[Math.floor(Math.random() * chars.length)];
    return pwd;
  }

  /* ── STATUS UPDATE ── */
  async function updateStatus(id, newStatus) {
    // If approving → generate credentials first
    if (newStatus === 'approved') {
      await approveWithCredentials(id);
      return;
    }

    const { error } = await sb
      .from('registrations')
      .update({ status: newStatus })
      .eq('id', id);

    if (error) { alert('Update failed: ' + error.message); return; }
    const rec = allData.find(r => r.id === id);
    if (rec) rec.status = newStatus;
    updatePendingCount();
    renderCards();
  }

  /* ── APPROVE + GENERATE CREDENTIALS ── */
  async function approveWithCredentials(id) {
    const rec = allData.find(r => r.id === id);
    if (!rec) return;

    // Check if already approved with credentials
    const { data: existing } = await sb
      .from('student_accounts')
      .select('username, password')
      .eq('registration_id', id)
      .maybeSingle();

    if (existing) {
      if (!confirm(`Account already exists for ${rec.name}.\nUsername: ${existing.username}\n\nRe-send credentials email?`)) return;
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_CREDS_TEMPLATE_ID, {
        student_name:  rec.name,
        student_email: rec.email,
        username:      existing.username,
        password:      existing.password,
        courses:       rec.courses_interested
      });
      alert('Credentials re-sent to ' + rec.email);
      return;
    }

    const username = generateUsername(rec.name);
    const password = generatePassword();

    // Save to student_accounts
    const { error: accErr } = await sb.from('student_accounts').insert([{
      registration_id: id,
      username,
      password,
      name:     rec.name,
      email:    rec.email,
      whatsapp: rec.whatsapp,
      courses:  rec.courses_interested,
      status:   'active'
    }]);
    if (accErr) { alert('Failed to create account: ' + accErr.message); return; }

    // Update registration status
    const { error: regErr } = await sb
      .from('registrations')
      .update({ status: 'approved' })
      .eq('id', id);
    if (regErr) { alert('Status update failed: ' + regErr.message); return; }

    // Send credentials email to student
    try {
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_CREDS_TEMPLATE_ID, {
        student_name:  rec.name,
        student_email: rec.email,
        username,
        password,
        courses: rec.courses_interested
      });
    } catch (e) {
      console.warn('Email failed:', e);
      alert(`Account created but email failed.\nUsername: ${username}\nPassword: ${password}\nPlease send manually to ${rec.email}`);
    }

    rec.status = 'approved';
    updatePendingCount();
    renderCards();
    alert(`✅ Approved!\nCredentials sent to ${rec.email}\nUsername: ${username}`);
  }

  /* ── SOFT DELETE (move to Deleted tab) ── */
  async function softDelete(id) {
    if (!confirm('Move this registration to the Deleted tab?')) return;
    await updateStatus(id, 'deleted');
  }

  /* ── HARD DELETE (permanent) ── */
  async function hardDelete(id) {
    const rec = allData.find(r => r.id === id);
    const name = rec ? rec.name : 'this record';
    if (!confirm(`Permanently delete "${name}"? This cannot be undone.`)) return;
    const { error } = await sb.from('registrations').delete().eq('id', id);
    if (error) { alert('Delete failed: ' + error.message); return; }
    allData = allData.filter(r => r.id !== id);
    updatePendingCount();
    renderCards();
  }

  /* ── LIGHTBOX ── */
  function openLightbox(id) {
    const rec = allData.find(r => r.id === id);
    if (!rec || !rec.receipt_data) return;
    document.getElementById('lbImg').src = rec.receipt_data;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>
