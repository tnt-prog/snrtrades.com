<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin — Trends & Trade</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:    #070F1A; --bg2: #0C1624; --bg3: #111E30;
      --gold:  #DAA520; --gold-d: #B8860B;
      --teal:  #2DD4BF;
      --border:rgba(255,255,255,0.08);
      --text:  #E8EEF4; --muted: #8A9BB0;
      --green: #22C55E; --red: #EF4444; --amber: #F59E0B;
      --sidebar: 220px;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

    /* ── LOGIN ── */
    #loginScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-box { background:var(--bg2); border:1px solid var(--border); border-radius:20px; padding:44px 40px; width:100%; max-width:380px; text-align:center; }
    .login-logo { font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:800; color:var(--gold); margin-bottom:4px; }
    .login-sub  { font-size:13px; color:var(--muted); margin-bottom:32px; }
    .inp { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:13px 14px; font-size:14px; color:var(--text); outline:none; margin-bottom:14px; }
    .inp:focus { border-color:var(--gold); }
    .btn-gold { width:100%; padding:13px; border-radius:10px; border:none; cursor:pointer; background:linear-gradient(135deg,var(--gold-d),var(--gold)); color:#070F1A; font-weight:700; font-size:14px; transition:opacity 0.2s; }
    .btn-gold:hover { opacity:0.88; }
    .login-err { color:var(--red); font-size:12px; margin-top:10px; display:none; }

    /* ── LAYOUT ── */
    #adminApp { display:none; min-height:100vh; }
    .layout { display:flex; min-height:100vh; }

    /* ── SIDEBAR ── */
    .sidebar {
      width:var(--sidebar); background:var(--bg2); border-right:1px solid var(--border);
      display:flex; flex-direction:column; position:fixed; top:0; left:0; height:100vh; z-index:50;
    }
    .sidebar-logo { padding:22px 20px 18px; border-bottom:1px solid var(--border); }
    .sidebar-logo span { font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:800; color:var(--gold); }
    .sidebar-logo small { display:block; font-size:10px; color:var(--muted); margin-top:2px; letter-spacing:0.5px; text-transform:uppercase; }
    .nav-section { padding:16px 12px 8px; font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; }
    .nav-item {
      display:flex; align-items:center; gap:10px; padding:10px 16px; margin:2px 8px;
      border-radius:10px; cursor:pointer; font-size:13px; font-weight:500; color:var(--muted);
      transition:all 0.15s; position:relative;
    }
    .nav-item:hover { background:rgba(255,255,255,0.04); color:var(--text); }
    .nav-item.active { background:rgba(218,165,32,0.12); color:var(--gold); }
    .nav-item .icon { font-size:16px; width:20px; text-align:center; }
    .nav-badge { margin-left:auto; background:var(--amber); color:#000; font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; min-width:20px; text-align:center; }
    .nav-badge.green { background:var(--green); color:#fff; }
    .sidebar-footer { margin-top:auto; padding:16px; border-top:1px solid var(--border); }
    .btn-logout { width:100%; padding:10px; border-radius:9px; background:transparent; border:1px solid var(--border); color:var(--muted); font-size:13px; cursor:pointer; }
    .btn-logout:hover { border-color:var(--red); color:var(--red); }

    /* ── MAIN ── */
    .main { margin-left:var(--sidebar); flex:1; display:flex; flex-direction:column; min-height:100vh; }
    .topbar { padding:16px 28px; border-bottom:1px solid var(--border); background:rgba(7,15,26,0.97); position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between; }
    .topbar-title { font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:800; }
    .topbar-sub { font-size:12px; color:var(--muted); margin-top:2px; }

    /* ── SECTION ── */
    .section { display:none; padding:24px 28px 40px; }
    .section.active { display:block; }

    /* FILTER / TOOLBAR */
    .toolbar { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
    .search-inp { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:9px 14px; font-size:13px; color:var(--text); outline:none; width:220px; }
    .search-inp:focus { border-color:var(--gold); }
    .filter-btn { padding:7px 16px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:13px; cursor:pointer; transition:all 0.15s; }
    .filter-btn.active { background:var(--gold); color:#070F1A; border-color:var(--gold); font-weight:700; }
    .filter-btn:hover:not(.active) { border-color:var(--gold); color:var(--gold); }
    .filter-btn.red { }
    .filter-btn.red:hover:not(.active) { border-color:var(--red); color:var(--red); }

    /* CARDS */
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:18px; }
    .card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    .card-header { padding:14px 16px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .card-name { font-weight:700; font-size:14px; }
    .card-ref  { font-size:11px; color:var(--muted); margin-top:2px; }
    .status-badge { font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:0.4px; }
    .s-pending  { background:rgba(245,158,11,0.12); color:var(--amber); border:1px solid rgba(245,158,11,0.3); }
    .s-approved { background:rgba(34,197,94,0.1); color:var(--green); border:1px solid rgba(34,197,94,0.3); }
    .s-rejected { background:rgba(239,68,68,0.1); color:var(--red); border:1px solid rgba(239,68,68,0.3); }
    .s-deleted  { background:rgba(100,100,100,0.1); color:var(--muted); border:1px solid rgba(100,100,100,0.2); }
    .card-body { padding:14px 16px; }
    .info-row { display:flex; gap:6px; font-size:12px; margin-bottom:7px; }
    .info-label { color:var(--muted); min-width:80px; flex-shrink:0; }
    .info-val { word-break:break-word; }
    .divider { border:none; border-top:1px solid var(--border); margin:10px 0; }
    .receipt-label { font-size:10px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
    .receipt-img { width:100%; border-radius:8px; border:1px solid var(--border); cursor:pointer; }
    .receipt-img:hover { opacity:0.85; }
    .receipt-none { font-size:12px; color:var(--muted); font-style:italic; }
    .card-actions { display:flex; gap:6px; padding:10px 16px 14px; border-top:1px solid var(--border); flex-wrap:wrap; }
    .btn-action { flex:1; min-width:70px; padding:8px 6px; border-radius:8px; border:none; cursor:pointer; font-size:12px; font-weight:700; transition:all 0.15s; }
    .btn-approve { background:rgba(34,197,94,0.1); color:var(--green); border:1px solid rgba(34,197,94,0.3); }
    .btn-approve:hover { background:var(--green); color:#fff; }
    .btn-reject  { background:rgba(239,68,68,0.1); color:var(--red); border:1px solid rgba(239,68,68,0.3); }
    .btn-reject:hover  { background:var(--red); color:#fff; }
    .btn-delete  { background:rgba(239,68,68,0.06); color:#F87171; border:1px solid rgba(239,68,68,0.18); }
    .btn-delete:hover  { background:var(--red); color:#fff; }
    .btn-restore { background:rgba(45,212,191,0.1); color:var(--teal); border:1px solid rgba(45,212,191,0.3); }
    .btn-restore:hover { background:var(--teal); color:#070F1A; }
    .btn-destroy { background:rgba(239,68,68,0.15); color:var(--red); border:1px solid rgba(239,68,68,0.4); }
    .btn-destroy:hover { background:var(--red); color:#fff; }
    .btn-action:disabled { opacity:0.35; cursor:not-allowed; }

    /* STUDENTS TABLE */
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:780px; }
    thead th { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; padding:9px 12px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
    tbody tr { border-bottom:1px solid var(--border); transition:background 0.12s; }
    tbody tr:hover { background:rgba(255,255,255,0.02); }
    tbody td { padding:11px 12px; font-size:13px; vertical-align:middle; }
    .td-user { font-family:monospace; font-size:11px; color:var(--teal); background:rgba(45,212,191,0.08); padding:3px 8px; border-radius:6px; display:inline-block; }
    .td-pwd { cursor:pointer; }
    .td-pwd .ph { letter-spacing:2px; color:var(--muted); }
    .td-pwd .pv { display:none; font-family:monospace; font-size:11px; }
    .td-pwd.show .ph { display:none; }
    .td-pwd.show .pv { display:inline; }
    .pill-active    { background:rgba(34,197,94,0.1); color:var(--green); border:1px solid rgba(34,197,94,0.3); }
    .pill-suspended { background:rgba(239,68,68,0.1); color:var(--red);   border:1px solid rgba(239,68,68,0.3); }
    .btn-sm { padding:4px 10px; border-radius:6px; border:none; cursor:pointer; font-size:11px; font-weight:700; transition:all 0.15s; white-space:nowrap; }
    .bs-sus  { background:rgba(245,158,11,0.1); color:var(--amber); border:1px solid rgba(245,158,11,0.3); }
    .bs-sus:hover  { background:var(--amber); color:#000; }
    .bs-act  { background:rgba(34,197,94,0.1); color:var(--green); border:1px solid rgba(34,197,94,0.3); }
    .bs-act:hover  { background:var(--green); color:#fff; }
    .bs-rst  { background:rgba(45,212,191,0.1); color:var(--teal); border:1px solid rgba(45,212,191,0.3); }
    .bs-rst:hover  { background:var(--teal); color:#070F1A; }
    .bs-del  { background:rgba(239,68,68,0.08); color:var(--red); border:1px solid rgba(239,68,68,0.2); }
    .bs-del:hover  { background:var(--red); color:#fff; }

    /* STATE */
    .state-msg { text-align:center; padding:50px 20px; color:var(--muted); font-size:14px; }
    .spinner-ring { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 14px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* LIGHTBOX */
    #lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:999; align-items:center; justify-content:center; }
    #lightbox.open { display:flex; }
    #lightbox img { max-width:90vw; max-height:90vh; border-radius:12px; }
    #lbClose { position:absolute; top:18px; right:24px; color:#fff; font-size:26px; cursor:pointer; line-height:1; }

    /* MOBILE SIDEBAR */
    .menu-toggle { display:none; background:transparent; border:1px solid var(--border); color:var(--text); padding:7px 12px; border-radius:8px; cursor:pointer; font-size:16px; }
    @media(max-width:700px) {
      .sidebar { transform:translateX(-100%); transition:transform 0.25s; }
      .sidebar.open { transform:translateX(0); }
      .main { margin-left:0; }
      .menu-toggle { display:block; }
      .section { padding:16px 16px 32px; }
      .topbar { padding:12px 16px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Trends & Trade</div>
    <div class="login-sub">Admin Panel</div>
    <input class="inp" type="password" id="pwdInput" placeholder="Enter admin password" autocomplete="current-password"/>
    <button class="btn-gold" onclick="checkLogin()">Sign In</button>
    <div class="login-err" id="loginErr">Incorrect password.</div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp">
  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <span>Trends & Trade</span>
        <small>Admin Panel</small>
      </div>

      <div class="nav-section">Main</div>
      <div class="nav-item active" onclick="showSection('registrations',this)" id="nav-registrations">
        <span class="icon">📋</span> Registrations
        <span class="nav-badge" id="badge-pending">0</span>
      </div>
      <div class="nav-item" onclick="showSection('students',this)" id="nav-students">
        <span class="icon">👨‍🎓</span> Students
        <span class="nav-badge green" id="badge-active">0</span>
      </div>

      <div class="sidebar-footer">
        <button class="btn-logout" onclick="logout()">Sign Out</button>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="topbar">
        <div>
          <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
          <div class="topbar-title" id="topbarTitle">Registrations</div>
          <div class="topbar-sub" id="topbarSub">Review and manage student registrations</div>
        </div>
      </div>

      <!-- ── REGISTRATIONS ── -->
      <div class="section active" id="section-registrations">
        <div class="toolbar">
          <button class="filter-btn active" onclick="setRegFilter('all',this)">All</button>
          <button class="filter-btn" onclick="setRegFilter('pending',this)">Pending</button>
          <button class="filter-btn" onclick="setRegFilter('approved',this)">Approved</button>
          <button class="filter-btn" onclick="setRegFilter('rejected',this)">Rejected</button>
          <button class="filter-btn red" onclick="setRegFilter('deleted',this)" style="border-color:rgba(239,68,68,0.3);color:#F87171;">🗑 Deleted</button>
        </div>
        <div class="grid" id="regGrid">
          <div class="state-msg"><div class="spinner-ring"></div>Loading…</div>
        </div>
      </div>

      <!-- ── STUDENTS ── -->
      <div class="section" id="section-students">
        <div class="toolbar">
          <input class="search-inp" type="text" id="studentSearch" placeholder="Search name, email, username…" oninput="renderStudents()"/>
          <button class="filter-btn active" onclick="setStuFilter('all',this)">All</button>
          <button class="filter-btn" onclick="setStuFilter('active',this)">Active</button>
          <button class="filter-btn" onclick="setStuFilter('suspended',this)">Suspended</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th><th>Name</th><th>Email</th><th>WhatsApp</th>
                <th>Username</th><th>Password</th><th>Courses</th>
                <th>Status</th><th>Joined</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="stuBody">
              <tr><td colspan="10"><div class="state-msg"><div class="spinner-ring"></div>Loading…</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div><!-- /main -->
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">
  <span id="lbClose">✕</span>
  <img id="lbImg" src="" alt="Receipt"/>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  /* ── CONFIG ── */
  const SUPABASE_URL      = 'https://ucpjcopozlunknosugxd.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjcGpjb3Bvemx1bmtub3N1Z3hkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjUzNDAsImV4cCI6MjEwMTk0MTM0MH0.82r72tSsEVdJThuOtXLh2MO2WhLE42IUgIKm9bCa_Mw';
  const ADMIN_PASSWORD    = 'snradmin2025';
  const EMAILJS_PUBLIC_KEY        = '3NuU-eUqGg06cjv1i';
  const EMAILJS_SERVICE_ID        = 'service_xmm4jck';
  const EMAILJS_CREDS_TEMPLATE_ID = 'template_k4spvuc';

  emailjs.init(EMAILJS_PUBLIC_KEY);
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let regData = [], stuData = [];
  let regFilter = 'all', stuFilter = 'all';

  /* ── LOGIN ── */
  document.getElementById('pwdInput').addEventListener('keydown', e => { if(e.key==='Enter') checkLogin(); });
  function checkLogin() {
    if (document.getElementById('pwdInput').value === ADMIN_PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminApp').style.display = 'block';
      loadAll();
    } else {
      document.getElementById('loginErr').style.display = 'block';
    }
  }
  function logout() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminApp').style.display = 'none';
    document.getElementById('pwdInput').value = '';
  }

  /* ── NAVIGATION ── */
  const sections = { registrations: { title:'Registrations', sub:'Review and manage student registrations' }, students: { title:'Students', sub:'View and manage approved student accounts' } };
  function showSection(name, el) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('section-' + name).classList.add('active');
    el.classList.add('active');
    document.getElementById('topbarTitle').textContent = sections[name].title;
    document.getElementById('topbarSub').textContent   = sections[name].sub;
    document.getElementById('sidebar').classList.remove('open');
  }
  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

  /* ── LOAD ALL ── */
  async function loadAll() { await Promise.all([loadRegistrations(), loadStudents()]); }

  /* ══════════════════════════════════════
     REGISTRATIONS
  ══════════════════════════════════════ */
  async function loadRegistrations() {
    const { data, error } = await sb.from('registrations').select('*').order('created_at',{ascending:false});
    if (error) { document.getElementById('regGrid').innerHTML=`<div class="state-msg">Error: ${error.message}</div>`; return; }
    regData = data || [];
    updateBadges();
    renderRegistrations();
  }

  function updateBadges() {
    document.getElementById('badge-pending').textContent = regData.filter(r=>r.status==='pending').length;
    document.getElementById('badge-active').textContent  = stuData.filter(s=>s.status==='active').length;
  }

  function setRegFilter(f, btn) {
    regFilter = f;
    document.querySelectorAll('#section-registrations .filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderRegistrations();
  }

  function renderRegistrations() {
    const list = regFilter==='all' ? regData.filter(r=>r.status!=='deleted') : regData.filter(r=>r.status===regFilter);
    const grid = document.getElementById('regGrid');
    if (!list.length) { grid.innerHTML=`<div class="state-msg">No ${regFilter==='all'?'':regFilter+' '}registrations.</div>`; return; }
    grid.innerHTML = list.map(r => buildRegCard(r)).join('');
  }

  function buildRegCard(r) {
    const cls = r.status==='approved'?'s-approved':r.status==='rejected'?'s-rejected':r.status==='deleted'?'s-deleted':'s-pending';
    const date = new Date(r.created_at).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const receipt = r.receipt_data
      ? `<div><div class="receipt-label">Payment Receipt</div><img class="receipt-img" src="${r.receipt_data}" onclick="openLightbox('${r.id}')" loading="lazy"/></div>`
      : `<div><div class="receipt-label">Payment Receipt</div><div class="receipt-none">No receipt</div></div>`;
    const isPending = r.status==='pending';
    const isDeleted = r.status==='deleted';
    const actions = isDeleted
      ? `<button class="btn-action btn-restore" onclick="regStatus('${r.id}','pending')">↩ Restore</button>
         <button class="btn-action btn-destroy" onclick="regHardDelete('${r.id}')">🗑 Delete Forever</button>`
      : `<button class="btn-action btn-approve" ${!isPending?'disabled':''} onclick="regApprove('${r.id}')">✓ Approve</button>
         <button class="btn-action btn-reject"  ${!isPending?'disabled':''} onclick="regStatus('${r.id}','rejected')">✕ Reject</button>
         <button class="btn-action btn-delete"  onclick="regSoftDelete('${r.id}')">🗑 Delete</button>`;
    return `<div class="card" id="rc-${r.id}">
      <div class="card-header">
        <div><div class="card-name">${esc(r.name)}</div><div class="card-ref">Ref: ${r.id.slice(0,8).toUpperCase()} · ${date}</div></div>
        <span class="status-badge ${cls}">${r.status}</span>
      </div>
      <div class="card-body">
        <div class="info-row"><span class="info-label">Email</span><span class="info-val">${esc(r.email)}</span></div>
        <div class="info-row"><span class="info-label">WhatsApp</span><span class="info-val">${esc(r.whatsapp)}</span></div>
        <div class="info-row"><span class="info-label">Country</span><span class="info-val">${esc(r.country)}</span></div>
        <div class="info-row"><span class="info-label">Age</span><span class="info-val">${r.age}</span></div>
        <hr class="divider"/>
        <div class="info-row"><span class="info-label">Experience</span><span class="info-val">${esc(r.trading_experience)}</span></div>
        <div class="info-row"><span class="info-label">Courses</span><span class="info-val">${esc(r.courses_interested)}</span></div>
        <div class="info-row"><span class="info-label">Payment</span><span class="info-val">${esc(r.payment_method)}</span></div>
        ${receipt}
      </div>
      <div class="card-actions">${actions}</div>
    </div>`;
  }

  async function regStatus(id, status) {
    const {error} = await sb.from('registrations').update({status}).eq('id',id);
    if (error) { alert('Failed: '+error.message); return; }
    const r = regData.find(r=>r.id===id); if(r) r.status=status;
    updateBadges(); renderRegistrations();
  }

  async function regSoftDelete(id) {
    if (!confirm('Move to Deleted tab?')) return;
    await regStatus(id,'deleted');
  }

  async function regHardDelete(id) {
    const r = regData.find(r=>r.id===id);
    if (!confirm(`Permanently delete "${r?.name||'this record'}"? Cannot be undone.`)) return;
    const {error} = await sb.from('registrations').delete().eq('id',id);
    if (error) { alert('Delete failed: '+error.message); return; }
    regData = regData.filter(r=>r.id!==id);
    updateBadges(); renderRegistrations();
  }

  async function regApprove(id) {
    const r = regData.find(r=>r.id===id); if(!r) return;
    const {data:existing} = await sb.from('student_accounts').select('username,password').eq('registration_id',id).maybeSingle();
    if (existing) {
      if (!confirm(`Account exists for ${r.name}.\nUsername: ${existing.username}\n\nRe-send credentials?`)) return;
      await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_CREDS_TEMPLATE_ID,{student_name:r.name,student_email:r.email,username:existing.username,password:existing.password,courses:r.courses_interested});
      alert('Credentials re-sent to '+r.email); return;
    }
    const username = 'SNR_' + r.name.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8) + '_' + Math.floor(10000+Math.random()*90000);
    const password = genPwd();
    const {error:ae} = await sb.from('student_accounts').insert([{registration_id:id,username,password,name:r.name,email:r.email,whatsapp:r.whatsapp,courses:r.courses_interested,status:'active'}]);
    if (ae) { alert('Account creation failed: '+ae.message); return; }
    await regStatus(id,'approved');
    try {
      await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_CREDS_TEMPLATE_ID,{student_name:r.name,student_email:r.email,username,password,courses:r.courses_interested});
    } catch(e) {
      alert(`Email failed. Credentials:\nUsername: ${username}\nPassword: ${password}\nSend manually to ${r.email}`);
    }
    await loadStudents();
    alert(`✅ Approved! Credentials sent to ${r.email}\nUsername: ${username}`);
  }

  /* ══════════════════════════════════════
     STUDENTS
  ══════════════════════════════════════ */
  async function loadStudents() {
    const {data,error} = await sb.from('student_accounts').select('*').order('created_at',{ascending:false});
    if (error) { document.getElementById('stuBody').innerHTML=`<tr><td colspan="10"><div class="state-msg">Error: ${error.message}</div></td></tr>`; return; }
    stuData = data||[];
    updateBadges();
    renderStudents();
  }

  function setStuFilter(f,btn) {
    stuFilter=f;
    document.querySelectorAll('#section-students .filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderStudents();
  }

  function renderStudents() {
    const q = (document.getElementById('studentSearch').value||'').toLowerCase();
    let rows = stuFilter==='all' ? stuData : stuData.filter(s=>s.status===stuFilter);
    if (q) rows = rows.filter(s=>(s.name||'').toLowerCase().includes(q)||(s.email||'').toLowerCase().includes(q)||(s.username||'').toLowerCase().includes(q));
    const tbody = document.getElementById('stuBody');
    if (!rows.length) { tbody.innerHTML=`<tr><td colspan="10"><div class="state-msg">No students found.</div></td></tr>`; return; }
    tbody.innerHTML = rows.map((s,i)=>{
      const date = new Date(s.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      const isActive = s.status==='active';
      return `<tr>
        <td style="color:var(--muted)">${i+1}</td>
        <td style="font-weight:600">${esc(s.name)}</td>
        <td><a href="mailto:${esc(s.email)}" style="color:var(--teal);text-decoration:none">${esc(s.email)}</a></td>
        <td style="color:var(--muted);font-size:12px">${esc(s.whatsapp||'—')}</td>
        <td><span class="td-user">${esc(s.username)}</span></td>
        <td class="td-pwd" onclick="this.classList.toggle('show')" title="Click to reveal"><span class="ph">••••••••</span><span class="pv">${esc(s.password)}</span></td>
        <td style="font-size:11px;color:var(--muted)">${esc(s.courses||'—')}</td>
        <td><span class="status-badge ${isActive?'pill-active':'pill-suspended'}">${s.status}</span></td>
        <td style="color:var(--muted);font-size:11px;white-space:nowrap">${date}</td>
        <td><div style="display:flex;gap:5px;flex-wrap:wrap">
          ${isActive?`<button class="btn-sm bs-sus" onclick="stuStatus('${s.id}','suspended')">Suspend</button>`:`<button class="btn-sm bs-act" onclick="stuStatus('${s.id}','active')">Activate</button>`}
          <button class="btn-sm bs-rst" onclick="stuReset('${s.id}')">Reset Pwd</button>
          <button class="btn-sm bs-del" onclick="stuDelete('${s.id}')">Delete</button>
        </div></td>
      </tr>`;
    }).join('');
  }

  async function stuStatus(id,status) {
    const {error}=await sb.from('student_accounts').update({status}).eq('id',id);
    if(error){alert('Failed: '+error.message);return;}
    const s=stuData.find(s=>s.id===id);if(s)s.status=status;
    updateBadges();renderStudents();
  }

  async function stuReset(id) {
    const s=stuData.find(s=>s.id===id);if(!s)return;
    if(!confirm(`Reset password for ${s.name} and email to ${s.email}?`))return;
    const pwd=genPwd();
    const {error}=await sb.from('student_accounts').update({password:pwd}).eq('id',id);
    if(error){alert('Failed: '+error.message);return;}
    s.password=pwd;renderStudents();
    try{
      await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_CREDS_TEMPLATE_ID,{student_name:s.name,student_email:s.email,username:s.username,password:pwd,courses:s.courses});
      alert(`✅ Password reset & sent to ${s.email}`);
    }catch(e){alert(`Password updated but email failed.\nNew password: ${pwd}\nSend manually to ${s.email}`);}
  }

  async function stuDelete(id) {
    const s=stuData.find(s=>s.id===id);
    if(!confirm(`Permanently delete account for ${s?.name}?`))return;
    const {error}=await sb.from('student_accounts').delete().eq('id',id);
    if(error){alert('Delete failed: '+error.message);return;}
    stuData=stuData.filter(s=>s.id!==id);
    updateBadges();renderStudents();
  }

  /* ── LIGHTBOX ── */
  function openLightbox(id) {
    const r=regData.find(r=>r.id===id);
    if(!r||!r.receipt_data)return;
    document.getElementById('lbImg').src=r.receipt_data;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox(){document.getElementById('lightbox').classList.remove('open');}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});

  /* ── HELPERS ── */
  function genPwd(len=10){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789@#!';let p='';for(let i=0;i<len;i++)p+=c[Math.floor(Math.random()*c.length)];return p;}
  function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
</html>
